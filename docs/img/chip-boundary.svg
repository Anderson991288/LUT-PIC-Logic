<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="What sits on the chip and what sits off the chip">
  <title>What sits on the chip and what sits off the chip</title>
  <defs>
    <marker id="l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.8"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#b45309" stroke-width="1.8"/></marker>
  </defs>
  <style>text{font-family:"Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif;fill:#1e293b}.h{font-size:16px;font-weight:600}.s{font-size:13px;fill:#475569}.b{font-size:13px}.n{font-size:12px}.g{font-size:12px;fill:#475569}.t{font-size:15px;font-weight:600;fill:#475569}.w{stroke:#2563eb;stroke-width:2.5;fill:none}.c{stroke:#b45309;stroke-width:2;stroke-dasharray:5 4;fill:none}.off{fill:#f1f5f9;stroke:#94a3b8}.rx{fill:#dcfce7;stroke:#16a34a}.ec{fill:#c7d2fe;stroke:#6366f1}</style>
  <rect width="1000" height="450" fill="#ffffff"/>

  <!-- chip: dashed frame -->
  <rect x="250" y="72" width="290" height="320" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="6 5"/>
  <text class="t" x="395" y="387" text-anchor="middle">Photonic chip (on-chip)</text>

  <!-- off-chip: light source and data -->
  <text class="t" x="125" y="92" text-anchor="middle">Off-chip: source and data</text>
  <text class="s" x="145" y="124" text-anchor="middle">Data x1–x4</text>
  <line class="c" x1="145" y1="131" x2="145" y2="153" marker-end="url(#e)"/>
  <rect class="off" x="12" y="220" width="46" height="60" rx="8"/>
  <text class="n" x="35" y="254" text-anchor="middle">Laser</text>
  <path class="w" d="M58 250H66M92 170H99M92 210H99M92 250H99M92 290H99M92 330H250"/>
  <rect class="off" x="66" y="156" width="26" height="188" rx="6"/>
  <text class="b" x="79" y="250" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 79 250)">Coupler</text>
  <g class="off"><rect x="100" y="155" width="90" height="30" rx="6"/><rect x="100" y="195" width="90" height="30" rx="6"/><rect x="100" y="235" width="90" height="30" rx="6"/><rect x="100" y="275" width="90" height="30" rx="6"/></g>
  <text class="n" x="145" y="174" text-anchor="middle">Modulator x1</text>
  <text class="n" x="145" y="214" text-anchor="middle">Modulator x2</text>
  <text class="n" x="145" y="254" text-anchor="middle">Modulator x3</text>
  <text class="n" x="145" y="294" text-anchor="middle">Modulator x4</text>
  <text class="s" x="145" y="323" text-anchor="middle">Reference</text>
  <path class="w" d="M190 170H250M190 210H250M190 250H250M190 290H250"/>
  <text class="s" x="220" y="160" text-anchor="middle">Fiber</text>

  <!-- on-chip -->
  <g class="ec"><rect x="250" y="162" width="22" height="16" rx="2"/><rect x="250" y="202" width="22" height="16" rx="2"/><rect x="250" y="242" width="22" height="16" rx="2"/><rect x="250" y="282" width="22" height="16" rx="2"/><rect x="250" y="322" width="22" height="16" rx="2"/><rect x="518" y="162" width="22" height="16" rx="2"/><rect x="518" y="202" width="22" height="16" rx="2"/><rect x="518" y="242" width="22" height="16" rx="2"/><rect x="518" y="282" width="22" height="16" rx="2"/><rect x="518" y="322" width="22" height="16" rx="2"/></g>
  <path class="w" d="M272 170H324M272 210H324M272 250H324M272 290H324M272 330H324M466 170H518M466 210H518M466 250H518M466 290H518M466 330H518"/>
  <rect x="324" y="150" width="142" height="200" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text class="h" x="395" y="226" text-anchor="middle">7 MZIs</text>
  <text class="s" x="395" y="248" text-anchor="middle">split and combine</text>
  <text class="h" x="395" y="284" text-anchor="middle">14 heaters</text>
  <text class="s" x="395" y="306" text-anchor="middle">tune the phase</text>
  <text class="g" x="298" y="146" text-anchor="middle">Waveguide</text>
  <text class="g" x="492" y="146" text-anchor="middle">Waveguide</text>
  <text class="g" x="256" y="363" text-anchor="start">Edge coupler</text>
  <text class="g" x="534" y="363" text-anchor="end">Edge coupler</text>
  <g font-size="12"><text class="s" x="298" y="165" text-anchor="middle">x1</text><text class="s" x="298" y="205" text-anchor="middle">x2</text><text class="s" x="298" y="245" text-anchor="middle">x3</text><text class="s" x="298" y="285" text-anchor="middle">x4</text><text class="s" x="298" y="325" text-anchor="middle">ref</text><text class="s" x="492" y="165" text-anchor="middle">o1</text><text class="s" x="492" y="205" text-anchor="middle">o2</text><text class="s" x="492" y="245" text-anchor="middle">o3</text><text class="s" x="492" y="285" text-anchor="middle">o4</text><text class="s" x="492" y="325" text-anchor="middle">o5</text></g>

  <!-- heater electrical path -->
  <rect class="off" x="300" y="14" width="190" height="36" rx="8"/>
  <text class="b" x="395" y="37" text-anchor="middle">Heater driver (off-chip)</text>
  <line class="c" x1="395" y1="50" x2="395" y2="80" marker-end="url(#e)"/>
  <g fill="#fde68a" stroke="#b45309"><rect x="341" y="82" width="12" height="12"/><rect x="359" y="82" width="12" height="12"/><rect x="377" y="82" width="12" height="12"/><rect x="395" y="82" width="12" height="12"/><rect x="413" y="82" width="12" height="12"/><rect x="431" y="82" width="12" height="12"/></g>
  <path class="c" d="M347 94V150M365 94V150M383 94V150M401 94V150M419 94V150M437 94V150"/>
  <text class="g" x="334" y="85" text-anchor="end">Electrical</text>
  <text class="g" x="334" y="101" text-anchor="end">pads</text>
  <text class="g" x="490" y="125" text-anchor="middle">Metal lines</text>

  <!-- off-chip: readout -->
  <text class="t" x="784" y="92" text-anchor="middle">Off-chip: readout</text>
  <path class="w" d="M540 170H584M540 330H584M540 210H584" marker-end="url(#l)"/>
  <path class="w" d="M540 250H556L572 290H584" marker-end="url(#l)"/>
  <path class="w" d="M540 290H556L572 250H584" marker-end="url(#l)"/>
  <text class="s" x="590" y="175" text-anchor="start">o1 monitor</text>
  <text class="s" x="590" y="335" text-anchor="start">o5 monitor</text>
  <g class="rx"><rect x="586" y="194" width="150" height="32" rx="6"/><rect x="586" y="234" width="150" height="32" rx="6"/><rect x="586" y="274" width="150" height="32" rx="6"/></g>
  <text class="n" x="661" y="214" text-anchor="middle">o2 detector + amplifier</text>
  <text class="n" x="661" y="254" text-anchor="middle">o4 detector + amplifier</text>
  <text class="n" x="661" y="294" text-anchor="middle">o3 detector + amplifier</text>
  <path class="c" d="M736 210H756" marker-end="url(#e)"/>
  <path class="c" d="M736 290H756" marker-end="url(#e)"/>
  <path class="c" d="M736 250H746V226H756" marker-end="url(#e)"/>
  <path class="c" d="M746 250V274H756" marker-end="url(#e)"/>
  <g class="rx"><rect x="758" y="186" width="96" height="50" rx="6"/><rect x="758" y="264" width="96" height="50" rx="6"/></g>
  <text class="b" x="806" y="206" text-anchor="middle">Comparator A</text>
  <text class="s" x="806" y="225" text-anchor="middle">o2 &gt; o4?</text>
  <text class="b" x="806" y="284" text-anchor="middle">Comparator B</text>
  <text class="s" x="806" y="303" text-anchor="middle">o4 &gt; o3?</text>
  <path class="c" d="M854 211H872" marker-end="url(#e)"/>
  <path class="c" d="M854 289H872" marker-end="url(#e)"/>
  <rect class="rx" x="874" y="196" width="110" height="108" rx="8"/>
  <text class="h" x="929" y="240" text-anchor="middle">AND gate</text>
  <text class="s" x="929" y="264" text-anchor="middle">output 0 or 1</text>

  <!-- legend -->
  <line class="w" x1="300" y1="426" x2="344" y2="426"/>
  <text class="s" x="352" y="431">Light (waveguide and fiber)</text>
  <line class="c" x1="540" y1="426" x2="584" y2="426"/>
  <text class="s" x="592" y="431">Electrical signal</text>
</svg>
