<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 170" width="968" height="170" role="img" aria-label="Five steps from idea to chip layout file">
  <title>Five steps from idea to chip layout file</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#475569" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:"Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif;fill:#1e293b}.h{font-size:15px;font-weight:600}.s{font-size:13px;fill:#475569}</style>
  <rect width="968" height="170" fill="#ffffff"/>
  <g fill="#eef2ff" stroke="#6366f1"><rect x="20" y="36" width="168" height="98" rx="10"/><rect x="210" y="36" width="168" height="98" rx="10"/><rect x="400" y="36" width="168" height="98" rx="10"/><rect x="590" y="36" width="168" height="98" rx="10"/><rect x="780" y="36" width="168" height="98" rx="10"/></g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="188" y1="85" x2="206" y2="85"/><line x1="378" y1="85" x2="396" y2="85"/><line x1="568" y1="85" x2="586" y2="85"/><line x1="758" y1="85" x2="776" y2="85"/></g>
  <text class="h" x="104" y="76" text-anchor="middle">① Logic design</text><text class="s" x="104" y="102" text-anchor="middle">find the 14 phases</text>
  <text class="h" x="294" y="76" text-anchor="middle">② Circuit simulation</text><text class="s" x="294" y="102" text-anchor="middle">check with device models</text>
  <text class="h" x="484" y="76" text-anchor="middle">③ Chip layout</text><text class="s" x="484" y="102" text-anchor="middle">draw the actual shapes</text>
  <text class="h" x="674" y="76" text-anchor="middle">④ Design checks</text><text class="s" x="674" y="102" text-anchor="middle">check shapes and wiring</text>
  <text class="h" x="864" y="76" text-anchor="middle">⑤ Data package</text><text class="s" x="864" y="102" text-anchor="middle">ready for others to use</text>
</svg>
