<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" role="img" aria-label="從想法到晶片圖檔的五個步驟">
  <title>從想法到晶片圖檔的五個步驟</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#475569" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b}.h{font-size:16px;font-weight:600}.s{font-size:13px;fill:#475569}</style>
  <rect width="860" height="170" fill="#ffffff"/>
  <g fill="#eef2ff" stroke="#6366f1"><rect x="20" y="36" width="140" height="98" rx="10"/><rect x="190" y="36" width="140" height="98" rx="10"/><rect x="360" y="36" width="140" height="98" rx="10"/><rect x="530" y="36" width="140" height="98" rx="10"/><rect x="700" y="36" width="140" height="98" rx="10"/></g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="160" y1="85" x2="186" y2="85"/><line x1="330" y1="85" x2="356" y2="85"/><line x1="500" y1="85" x2="526" y2="85"/><line x1="670" y1="85" x2="696" y2="85"/></g>
  <text class="h" x="90" y="76" text-anchor="middle">① 邏輯設計</text><text class="s" x="90" y="102" text-anchor="middle">算出 14 個相位</text>
  <text class="h" x="260" y="76" text-anchor="middle">② 電路模擬</text><text class="s" x="260" y="102" text-anchor="middle">用元件模型驗算</text>
  <text class="h" x="430" y="76" text-anchor="middle">③ 晶片 layout</text><text class="s" x="430" y="102" text-anchor="middle">畫出實際圖形</text>
  <text class="h" x="600" y="76" text-anchor="middle">④ 設計檢查</text><text class="s" x="600" y="102" text-anchor="middle">檢查圖形與連線</text>
  <text class="h" x="770" y="76" text-anchor="middle">⑤ 資料彙整</text><text class="s" x="770" y="102" text-anchor="middle">整理成可接手資料</text>
</svg>
