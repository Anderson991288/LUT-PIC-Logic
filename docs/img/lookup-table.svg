<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="The idea of a LUT4 lookup">
  <title>The idea of a LUT4 lookup</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#475569" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:"Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif;fill:#1e293b}.h{font-size:17px;font-weight:600}.s{font-size:14px;fill:#475569}.m{font-size:15px;font-family:Consolas,"Courier New",monospace}</style>
  <rect width="860" height="300" fill="#ffffff"/>
  <rect x="24" y="84" width="170" height="126" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="h" x="109" y="126" text-anchor="middle">Four inputs</text>
  <text class="m" x="109" y="156" text-anchor="middle">1  0  1  1</text>
  <text class="s" x="109" y="184" text-anchor="middle">16 combinations</text>
  <line x1="194" y1="147" x2="256" y2="147" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="260" y="24" width="300" height="252" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text class="h" x="410" y="54" text-anchor="middle">Answer table (truth table)</text>
  <text class="m" x="300" y="88">0 0 0 0 → 0</text>
  <text class="m" x="300" y="112">0 0 0 1 → 1</text>
  <text class="m" x="300" y="136">0 0 1 0 → 1</text>
  <text class="m" x="300" y="160">  ⋮  16 rows in all</text>
  <rect x="290" y="172" width="240" height="28" rx="5" fill="#fde68a" stroke="#d97706"/>
  <text class="m" x="300" y="191">1 0 1 1 → 1</text>
  <text class="s" x="410" y="230" text-anchor="middle">Tune the 14 heaters = load a new table</text>
  <text class="s" x="410" y="254" text-anchor="middle">65,536 tables in all</text>
  <line x1="560" y1="186" x2="636" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="640" y="132" width="196" height="108" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text class="h" x="738" y="176" text-anchor="middle">Output answer</text>
  <text class="m" x="738" y="208" text-anchor="middle">1</text>
</svg>
